<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E6BD4B">
  <meta name="description" content="기기에만 기록하는 나의 가계부. 오늘의 예산과 소비를 차분하게 관리하세요.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>차곡 · 나의 가계부</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="./boot.js" defer></script>
  <script src="./app.bundle.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h17M8 15v-4m5 4V7m5 8V4"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 8V5H6a3 3 0 0 0 0 6h15v9H6a3 3 0 0 1-3-3V8"/><path d="M21 11h-5v5h5M17 13.5h.01"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18M8 15h2m4 0h2m-8 3h2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m10 3-1 3-3 1-3 3 2 2-1 3 3 3 3-1 2 3 3-1 1-3 3-1 1-4-3-2V7l-4-2Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C8 2 2 8 5 15s17 7 15-12ZM5 20 16 9"/></symbol>
  </svg>
  <div class="app-shell">
    <div class="sidebar-scrim" id="sidebar-scrim"></div>
    <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
      <a class="brand" href="#dashboard" aria-label="차곡 메인"><span class="brand-mark"><i></i><i></i><i></i></span><span>차곡<span class="brand-dot">.</span></span></a>
      <button class="book-name" id="book-name" title="가계부 이름과 예산 설정">나의 가계부 <span>✎</span></button>
      <p class="nav-caption">나의 재무 공간</p>
      <nav id="navigation">
        <a href="#dashboard" data-route="dashboard"><svg class="icon"><use href="#i-home"/></svg><span>메인</span></a>
        <a href="#entry" data-route="entry"><svg class="icon"><use href="#i-plus"/></svg><span>돈 쓰기 / 벌기</span></a>
        <a href="#history" data-route="history"><svg class="icon"><use href="#i-history"/></svg><span>내역 보기</span></a>
        <a href="#analytics" data-route="analytics"><svg class="icon"><use href="#i-chart"/></svg><span>지출 분석</span></a>
        <a href="#accounts" data-route="accounts"><svg class="icon"><use href="#i-wallet"/></svg><span>내 계좌 모음</span></a>
        <a href="#fixed" data-route="fixed"><svg class="icon"><use href="#i-calendar"/></svg><span>고정비 스케줄러</span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-note"><svg class="icon"><use href="#i-shield"/></svg><strong>내 기록은 내 기기에</strong><p>회원가입도, 금융 연동도 없이<br>나만의 속도로 기록하세요.</p></div>
        <button class="sidebar-settings" data-action="settings"><svg class="icon"><use href="#i-settings"/></svg>설정 및 데이터 관리</button>
        <span class="sidebar-foot">작은 기록이 만드는 좋은 습관 · 1.0.1</span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-start"><button class="icon-button menu-toggle" id="menu-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="sidebar"><svg class="icon"><use href="#i-menu"/></svg></button><span class="breadcrumb">나의 가계부 <span>/</span> <b id="breadcrumb-page">메인</b></span></div>
        <div class="topbar-end"><span class="local-badge"><span></span>기기에 저장</span><button class="icon-button" data-action="settings" aria-label="설정"><svg class="icon"><use href="#i-settings"/></svg></button></div>
      </header>
      <div class="notice-bar" id="notice-bar" hidden role="status"></div>
      <main id="main" tabindex="-1">
        <div class="page-heading"><div><p class="eyebrow" id="page-eyebrow">나의 하루, 나의 예산</p><h1 id="page-title">메인</h1><p class="page-description" id="page-description"></p></div><label class="month-control"><svg class="icon"><use href="#i-calendar"/></svg><span class="sr-only">조회 월</span><input type="month" id="month-picker" min="2000-01" aria-label="조회 월"></label></div>
        <div id="view" aria-live="off"><article class="card startup-card"><p class="eyebrow">나의 첫 가계부</p><h2>기록 없이 바로 시작하세요.</h2><p id="startup-message">가계부 화면을 준비하고 있습니다. 계좌나 백업 파일이 없어도 시작할 수 있습니다.</p></article></div>
        <footer class="page-footer"><span>차곡 · 오늘의 기록이 내일의 여유로</span><span id="save-status">아직 저장된 기록이 없습니다</span></footer>
      </main>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><form id="modal-form"><div class="modal-heading"><h2 id="modal-title"></h2><button type="button" class="icon-button" id="modal-close" aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="modal-body"></div><p class="form-error" id="modal-error" role="alert" hidden></p><div class="modal-actions"><button type="button" class="button secondary" id="modal-cancel">취소</button><button class="button primary" id="modal-submit" type="submit">저장하기</button></div></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript>가계부를 사용하려면 브라우저의 JavaScript를 활성화해 주세요.</noscript>
</body>
</html>
